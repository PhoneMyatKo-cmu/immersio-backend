[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --import-mode=importlib --strict-markers"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: pure tests with no real I/O (fast)",
    "integration: tests that touch the DB, the JMdict data file, or component wiring",
    "video_submission: Video Submission feature",
    "word_lookup: Word Look Up feature",
    "caption_helper: caption-helper utility tests",
    "lookup: dictionary-lookup utility tests",
    "system: end-to-end / system tests exercising routes through the FastAPI TestClient",
]
