name: CICD

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.15.13 check . --ignore E712,E701,E702,F403,F405,F841,F401,F811

  test:
    runs-on: ubuntu-latest
    needs: lint                      # don't spend minutes on tests if lint fails

    services:
      postgres:
        image: postgres:17           # same as docker-compose.yml
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: immersio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/immersio_test
      # Read at import time by db/base.py and the auth/external services.
      # Dummy values: tests stub the real calls.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/immersio_test
      SECURITY_KEY: ci-only-not-a-secret
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      GEMINI_API_KEY: dummy
      YOUTUBE_API_KEY: dummy
      YOUTUBE_API_BASE_URL: https://www.googleapis.com/youtube/v3

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Restore virtual environment (packages + UniDic)
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies (only when the cache missed)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -r requirements.txt pytest
          .venv/bin/python -m unidic download

      - name: Unit tests
        run: .venv/bin/python -m pytest -m unit
          --ignore=tests/utils/test_dictionary_lookup_helpers.py
          --ignore=tests/utils/test_captions_helpers.py
          --ignore=tests/services/test_vocab_services.py
          --ignore=tests/api

      - name: Integration tests
        run: .venv/bin/python -m pytest -m integration
          --ignore=tests/utils/test_dictionary_lookup_helpers.py
          --ignore=tests/utils/test_captions_helpers.py
          --ignore=tests/services/test_vocab_services.py
          --ignore=tests/api

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'   
    runs-on: ubuntu-latest
    concurrency: deploy  # never run two deploys at the same time
    environment: Production          

    steps:
      - name: Check deploy secrets are set
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -n "$HOST" ]  || missing="$missing DEPLOY_HOST"
          [ -n "$USER" ]  || missing="$missing DEPLOY_USER"
          [ -n "$KEY" ]   || missing="$missing DEPLOY_SSH_KEY"
          [ -n "$KNOWN" ] || missing="$missing DEPLOY_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::Missing deploy secrets:$missing (check the job's 'environment:' and the secret names)"
            exit 1
          fi  

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy the tested commit
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash -s -- "${{ github.sha }}" <<'EOF'
          set -e
          SHA="$1"
          cd ~/immersio-backend
          PREVIOUS=$(git rev-parse HEAD)
          echo "$PREVIOUS" > ~/.last_good_deploy
          git fetch --quiet origin
          git checkout --quiet "$SHA"
          ~/venv/bin/pip install -q -r requirements.txt
          sudo systemctl restart immersio
          EOF

      - name: Health check (rollback on failure)
        run: |
          for i in $(seq 1 18); do       # up to ~90 s: Whisper loads at startup
            if curl -fsS https://52-77-115-201.sslip.io/ > /dev/null; then
              echo "Healthy"; exit 0
            fi
            sleep 5
          done
          echo "Health check failed, rolling back"
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'cd ~/immersio-backend && git checkout --quiet "$(cat ~/.last_good_deploy)" && ~/venv/bin/pip install -q -r requirements.txt && sudo systemctl restart immersio'
          exit 1 